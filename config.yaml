# Shared SA828 radio — one channel for every sender.
radio:
  channel: 3
  squelch: 1
  ctcss: 0
  uart_port: /dev/ttyAMA0
  ch_bit1_gpio: 5
  ch_bit2_gpio: 6
  ch_bit4_gpio: 12
  ch_bit8_gpio: 13
  ptt_gpio: 23
  spken_gpio: 24
  audio_device: plughw:CARD=Headphones,DEV=0
  muted: false

# Optional. Empty = off (VisionLab works with no header).
# When set, POST /tx needs X-MessengerBird-Token or Authorization: Bearer …
auth_token: ""

# Each sender is its own endpoint for a different machine / VisionLab sound.
# Bind is always 0.0.0.0 so Tailscale / LAN / WAN reach the Pi.
# VisionLab host field = Tailscale IP / MagicDNS / public IP (no port).
# POST http://<host>:<port>/tx — no message body required.
senders:
  - id: silo_empty
    name: Silo is empty
    listen: 0.0.0.0:8787
    message: Silo is empty
  - id: check_camera
    name: Check camera
    listen: 0.0.0.0:8788
    message: Check camera
  - id: starlinger_red
    name: Starlinger red
    listen: 0.0.0.0:8789
    message: Starlinger red
