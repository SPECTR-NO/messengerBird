[package]
name = "messenger-bird"
version = "0.2.0"
edition = "2021"
description = "Straight SA828 radio sender desktop app for Raspberry Pi"

[[bin]]
name = "messenger-bird"
path = "src/main.rs"

[dependencies]
rppal = "0.22.1"
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = { version = "2.12", default-features = true, features = ["json"] }
